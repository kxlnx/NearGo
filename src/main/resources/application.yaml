server:
  port: ${SERVER_PORT:8081}
spring:
  application:
    name: neargo
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${MYSQL_URL:jdbc:mysql://127.0.0.1:3306/hmdp?useSSL=false&serverTimezone=UTC}
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:}
  redis:
    host: ${REDIS_HOST:127.0.0.1}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:}
    lettuce:
      pool:
        max-active: 10
        max-idle: 10
        min-idle: 1
        time-between-eviction-runs: 10s
  jackson:
    default-property-inclusion: non_null # JSON处理时忽略非空字段
rocketmq:
  name-server: ${ROCKETMQ_NAME_SERVER:127.0.0.1:9876}
  producer:
    group: ${ROCKETMQ_PRODUCER_GROUP:neargo-seckill-producer}
    send-message-timeout: 3000
seckill:
  consumer:
    enabled: ${SECKILL_CONSUMER_ENABLED:true}
  rocketmq:
    order-topic: ${SECKILL_ORDER_TOPIC:seckill-order-topic}
    order-consumer-group: ${SECKILL_ORDER_CONSUMER_GROUP:seckill-order-consumer}
    timeout-topic: ${ORDER_TIMEOUT_TOPIC:order-timeout-topic}
    timeout-consumer-group: ${ORDER_TIMEOUT_CONSUMER_GROUP:order-timeout-consumer}
    timeout-delay-level: ${ORDER_TIMEOUT_DELAY_LEVEL:5}
  reconcile:
    enabled: ${SECKILL_RECONCILE_ENABLED:true}
    stale-seconds: ${SECKILL_RECONCILE_STALE_SECONDS:30}
    retry-interval-seconds: ${SECKILL_RECONCILE_RETRY_INTERVAL_SECONDS:60}
xxl:
  job:
    admin:
      addresses: ${XXL_JOB_ADMIN_ADDRESSES:http://127.0.0.1:8080/xxl-job-admin}
      accessToken: ${XXL_JOB_ACCESS_TOKEN:}
    executor:
      appname: ${XXL_JOB_EXECUTOR_APPNAME:neargo-executor}
      address: ${XXL_JOB_EXECUTOR_ADDRESS:}
      ip: ${XXL_JOB_EXECUTOR_IP:127.0.0.1}
      port: ${XXL_JOB_EXECUTOR_PORT:9999}
      logpath: ${XXL_JOB_EXECUTOR_LOGPATH:./logs/xxl-job/jobhandler}
      logretentiondays: ${XXL_JOB_EXECUTOR_LOG_RETENTION_DAYS:30}
mybatis-plus:
  type-aliases-package: com.hmdp.entity # 别名扫描包
logging:
  level:
    com.hmdp: debug
